name: CI Pipeline

on:
  push:
    branches: 
    - main #сработает при пуше в main и develop ветки
    - develop
    - 'develop/**'  # все ветки, начинающиеся с develop/
  pull_request: 
    branches: 
    - main #при пулл реквесте в мейн  
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/log-analyzer #ссылка на гихаб регистри проекта
  CACHE_FROM: type=gha
  CACHE_TO: type=gha,mode=max

jobs:
  lint: # job
    name: Lint code
    runs-on: self-hosted #указываем что запускаем локально  

    steps:
      - name: Checkout code 
        uses: actions/checkout@v7 #готовый переиспользуемый модуль, клонирует репозиторий в job 
      
      - name: Установка python + poetry и кеширование зависимостей .venv
        uses: ./.github/actions/setup-python-poetry
        with: 
          python-version: 3.14
      
      - name: Run Ruff linter
        run: poetry run ruff check src/ tests/
      
      - name: Check formatting
        run: poetry run ruff format --check src tests

  test: 
    name: Test Python ${{ matrix.python_version }} 
    runs-on: self-hosted
    needs: lint # запускаем после успешного lint

    strategy:
      max-parallel: 1
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false #продолжит если одна упала

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name:  Установка python + poetry и кеширование зависимостей .venv
        uses: ./.github/actions/setup-python-poetry
        with: 
          python-version: ${{ matrix.python-version }}

      
      - name: Запуск тестов
        run: | # запускаем тесты с отчетом по покрытию кода
          poetry run pytest --cov=src --cov-report=xml --cov-report=term-missing 
        
      - name: Загрузка отчета покрытия тестами
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with: 
          files: ./coverage.xml #файл отчета 
          flags: unittests
          name: codecov-umbrella #пользовательское название
          fail_ci_if_error: false

  build: 
    name: Build Docker Image, создание локального образа и его проверка
    runs-on: self-hosted
    needs: test #выполнится только после успешных тестов

    outputs: #указываем что получаем на выходе, проброс данных, сможем использовать в других джобах
      image-digest: ${{ steps.build.outputs.digest }} #хеш(sha) образа
      image-tag: ${{ steps.meta.outputs.tags }} #теги образа(все)
      image-labels: ${{ steps.meta.outputs.labels }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Сетап docker buildx #создаем сборщик образов
        uses: docker/setup-buildx-action@v4
      
      - name: Сбор метаданных с репозитория 
        id: meta 
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }} # используем путь к docker образу из registry
          #собираем тег для образа, ветка, коммит, версия и тд.
          tags: |
            type=ref,event=branch  
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: . #указываем откуда брать dockerfile 
          push: false  # Не пушим в CI, только билдим
          tags: ${{ steps.meta.outputs.tags }} #используем тег для образа из метаданных
          labels: ${{ steps.meta.outputs.labels }} 
          cache-from: ${{ env.CACHE_FROM }} #используем кеш github actions (там хранятся слои)
          cache-to: ${{ env.CACHE_TO }} #кешируем в github actions и используем все слои для кеша
          outputs: type=docker # сохраняем ЛОКАЛЬНО образ
       
      - name: Test Docker image
        # Проверяем что образ работает
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Testing image: $IMAGE_TAG"
          docker run --rm "$IMAGE_TAG" --help || echo "Warning: --help failed, but continuing"

  push:
    name: Push to Registry 
    runs-on: self-hosted
    needs: build

    #джоба сработает при пуше в мейн или develop ветку
    if: >
      github.event_name == 'push' && 
      (github.ref_name == 'main' || github.ref_name == 'develop' || startsWith(github.ref_name, 'develop/'))  
 
    permissions: 
      contents: read #позволяет читать из репозитория 
      packages: write #позволяет размещать в репозитории или регистри 
    
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7
      
      - name: Сетап docker buildx #создаем сборщик образов
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry # авторизация в регистри
        uses: docker/login-action@v4 
        with:
          registry: ghcr.io #указание на registry
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} #идентифицирующий токен, автоматически создается в джобе
      
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7 
        with:
          context: . 
          push: true
          # тег образа указываем из прошлой джобы через needs, там мы собирали метаинформацию
          tags: ${{ needs.build.outputs.image-tag }} 
          labels: ${{ needs.build.outputs.labels }}
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: ${{ env.CACHE_TO }}