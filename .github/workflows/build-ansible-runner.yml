name: Build Ansible runner

on: 
  push:  
    branches:
      - main
      - develop
      - 'develop/**'
    paths:
      - '.github/ansible-runner/**'
  workflow_dispatch:

env:
  REGISTRY: ghrc.io   
  IMAGE_NAME: ${{ github.repository }}/ansible-runner

jobs: 
  build: 
    name: Build Ansible Runner Image
    runs-on: self-hosted

    permissions: 
      contents: read
      packages: write
    
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7 #готовый переиспользуемый модуль, клонирует репозиторий в job 
      
      - name: Сетап docker buildx #создаем сборщик образов
        uses: docker/setup-buildx-action@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .github/ansible-runner
          file: .github/ansible-runner/Dockerfile 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "Image built and pushed:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"