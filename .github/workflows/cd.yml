name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"] #запускаем после CI pipline
    types: completed  # когда он завершился
    branches:
    - main
    - develop
    - 'develop/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment' # в ручном запуске выбор в какое окружение деплоиться
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  

jobs:
  build-runner:
    name: Build Ansible Runner Image
    runs-on: self-hosted

    #выполняем job если ci завершился успешно или при ручном запуске
    if: >
      (github.event.workflow_run.conclusion == 'success' && 
      (github.event.workflow_run.head_branch == 'main' || 
      github.event.workflow_run.head_branch == 'develop' || 
      startsWith(github.event.workflow_run.head_branch, 'develop/'))) ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    outputs:
      # на выходе получим образ
      container-image: ${{ steps.container-tag.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Принудительно приводим имя репозитория к нижнему регистру через bash
      - name: Set lowercase repository name
        id: repo_name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry 
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ansible-runner #используем уже с lowercase
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .github/ansible-runner
          file: .github/ansible-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }} # теги собранные на прошлом этапе
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max # кешируем все слои

      - name: Export container image tag
        id: container-tag
        # перенаправляем тег с sha(текущим комитом) в вывод outputs
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/ansible-runner@${{ steps.build-push.outputs.digest }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT" 

  deploy:
    name: Deploy via Ansible
    runs-on: self-hosted
    needs: build-runner # зависим от сборки образа

    # запустит в случае если запуск вручную или при успешном worflow_run
    if: always() && (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch')

    #передаем куда будем деплоить 
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    env: # чтобы не падало из за known hosts
      ANSIBLE_HOST_KEY_CHECKING: "False"
      # образ из предыдущей джобы
      CONTAINER_IMAGE: ${{ needs.build-runner.outputs.container-image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

        #приводим к нижнему регистру
      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare SSH key
        run: |
          mkdir -p ${{ github.workspace }}/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ${{ github.workspace }}/.ssh/deploy_key
          chmod 600 ${{ github.workspace }}/.ssh/deploy_key

      - name: Test SSH connection
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/.ssh:/root/.ssh:ro \
            ${{ env.RUNNER_IMAGE }} \
            ssh -i /root/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "hostname && whoami && docker --version"

      - name: Prepare host (idempotent)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/.ssh:/root/.ssh:ro \
            -v ${{ github.workspace }}/ansible:/workspace/ansible:ro \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            ${{ env.RUNNER_IMAGE }} \
            ansible-playbook /workspace/ansible/playbooks/prepare-host.yml \
              -i /workspace/ansible/inventory.ini \
              --extra-vars "ansible_host=${{ secrets.SSH_HOST }} ansible_user=${{ secrets.SSH_USER }}"
        continue-on-error: true

      - name: Deploy application
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/.ssh:/root/.ssh:ro \
            -v ${{ github.workspace }}/ansible:/workspace/ansible:ro \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            ${{ env.RUNNER_IMAGE }} \
            ansible-playbook /workspace/ansible/playbooks/deploy.yml \
              -i /workspace/ansible/inventory.ini \
              --extra-vars "ansible_host=${{ secrets.SSH_HOST }} ansible_user=${{ secrets.SSH_USER }}" \
              --extra-vars "registry_user=${{ github.actor }}" \
              --extra-vars "registry_password=${{ secrets.GITHUB_TOKEN }}" \
              --extra-vars "docker_image=ghcr.io/${{ env.REPO_LOWER }}/log-analyzer" \
              --extra-vars "docker_tag=${{ github.sha }}" \
              --extra-vars "github_repository=${{ github.repository }}"


      - name: Cleanup secrets
        if: always()
        run: rm -rf ${{ github.workspace }}/.ssh