[project]
name = "log-analyzer"
version = "0.1.0"
description = "Nginx log analyzer"
authors = [
    { name = "AIWesty", email = "dmitriistrekalin@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "tqdm>=4.68.3,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=html"


[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]